<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPO AIR 1 - Delhi Police SI Exam Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="brand-title">CPO AIR 1</div>
        <div class="uniform-subtitle">Delhi Police Sub Inspector Uniform Mission</div>
        <div class="top-right-controls">
            <button id="langToggleBtn" onclick="toggleLanguage()">🌐 EN / HI</button>
            <button id="themeToggleBtn" onclick="toggleTheme()">🌓 Theme</button>
            <button id="readingModeBtn" onclick="toggleReadingMode()">📖 Read Mode</button>
        </div>
    </header>

    <main id="appBody">
        <section id="authView" class="view active">
            <h2>Candidate & Admin Portal Login</h2>
            <input type="email" id="loginEmail" placeholder="Enter Gmail ID">
            <input type="password" id="loginPassword" placeholder="Enter Password">
            <button onclick="handleLogin()">Login / Stay Logged In</button>
        </section>

        <section id="dashboardView" class="view">
            <div id="adminPanel" style="display:none;" class="admin-box">
                <h3>Admin Control Center</h3>
                <input type="email" id="adminEmailCheck" value="ajayraoshab751@gmail.com" readonly>
                <select id="mockSectionSelect">
                    <option value="Math">Math Chapters</option>
                    <option value="Reasoning">Reasoning Chapters</option>
                    <option value="GKGS">GK/GS Chapters</option>
                    <option value="English">English Chapters</option>
                </select>
                <input type="text" id="mockTitleInput" placeholder="Mock Test Title">
                <input type="file" id="mockFileInput">
                <button onclick="uploadMockTest()">Upload & Convert Mock via AI (Limitless)</button>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button onclick="switchTab('test')">1. Test</button>
        <button onclick="switchTab('performance')">2. Performance</button>
        <button onclick="switchTab('challenge')">3. Challenge</button>
        <button onclick="switchTab('doubt')">4. Ask Doubt</button>
        <button onclick="switchTab('target')">5. Target</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
