<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPO MOCK TEST</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #1a1a1a; }
        .hidden { display: none !important; }

        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
        .brand { font-weight: 700; font-size: 18px; color: #1e3c72; }

        .auth-container { max-width: 400px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .auth-container input, .auth-container select, .code-box input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-blue { background: #1a73e8; color: #fff; border: none; padding: 10px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .toggle-btn { background: none; border: none; color: #1a73e8; text-decoration: underline; cursor: pointer; width: 100%; margin-top: 12px; font-size: 13px; }

        .container { max-width: 800px; margin: 20px auto; padding: 16px; }
        .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; border: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .code-box { background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
        .btn-start { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .instructions-box { background: #fff; padding: 20px; border-radius: 8px; max-width: 800px; margin: 20px auto; border: 1px solid #ccc; }
        .test-header { background: #002d62; color: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        .test-body { display: flex; flex-direction: column; min-height: calc(100vh - 60px); }
        .question-box { background: #fff; padding: 20px; flex: 1; }
        .option-item { border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin: 10px 0; cursor: pointer; }
        .option-item.selected { background: #e8f0fe; border-color: #1a73e8; font-weight: bold; }
        .test-controls { background: #f1f3f4; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="brand">🎯 CPO MOCK TEST</div>
        <div id="userDisplay" style="font-size: 13px;"></div>
    </div>

    <!-- Registration Form -->
    <div id="registerSection" class="auth-container">
        <h3 style="margin-bottom:12px;">Student Registration</h3>
        <input type="text" id="regFullName" placeholder="Full Name">
        <input type="number" id="regAge" placeholder="Age">
        <select id="regGender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <input type="text" id="regPlace" placeholder="Place / City">
        <input type="text" id="regUser" placeholder="Username / Email">
        <input type="password" id="regPass" placeholder="Password">
        <button class="btn-blue" onclick="register()">Register Account</button>
        <button class="toggle-btn" onclick="showLoginForm()">Already have an account? Login</button>
    </div>

    <!-- Login Form -->
    <div id="loginSection" class="auth-container hidden">
        <h3 style="margin-bottom:12px;">Login</h3>
        <input type="text" id="loginUser" placeholder="Username / Email">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn-blue" onclick="login()">Login</button>
        <button class="toggle-btn" onclick="showRegisterForm()">New user? Register here</button>
    </div>

    <!-- Main Dashboard -->
    <div id="mainDashboard" class="container hidden">
        <div id="lockContainer" class="code-box">
            <h4>🔒 Enter Access Code</h4>
            <p style="font-size: 12px; color: #666; margin-top: 4px;">Enter passcode to unlock tests.</p>
            <input type="text" id="accessCodeInput" placeholder="Enter Access Code (e.g. CPOAIR1)">
            <button class="btn-blue" onclick="verifyAccessCode()">Unlock Tests</button>
        </div>

        <h3 style="margin-bottom: 12px;">Available Mock Tests</h3>
        <div id="testList"></div>
    </div>

    <!-- Instructions Screen -->
    <div id="instructionScreen" class="instructions-box hidden">
        <h2 id="instTitle">Test Instructions</h2>
        <p style="margin: 12px 0;">Total Time: 15 Minutes | +2 for correct answer, -0.5 for wrong answer.</p>
        <label style="font-size: 13px; display: block; margin-bottom: 16px;">
            <input type="checkbox" id="declarationCheck"> I have read all instructions carefully.
        </label>
        <button class="btn-blue" onclick="startTestActual()">I am ready to begin</button>
    </div>

    <!-- Test Interface -->
    <div id="testPortal" class="hidden">
        <div class="test-header">
            <span id="portalTestTitle">Test Portal</span>
            <div id="timerDisplay" style="background: #28a745; padding: 4px 8px; border-radius: 4px; font-weight: bold;">15:00</div>
        </div>
        <div class="test-body">
            <div class="question-box">
                <div style="font-size: 12px; color: #666; margin-bottom: 8px;">Question <span id="qNum">1</span></div>
                <h4 id="questionText" style="margin-bottom: 16px;">Question text...</h4>
                <div id="optionsContainer"></div>
            </div>
            <div class="test-controls">
                <button class="btn-blue" style="background:#28a745; width:auto; margin-left:auto;" onclick="finishTest()">Submit Test</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_CODE = "CPOAIR1";
        let isUnlocked = false;

        const ALL_MOCK_TESTS = [
            {
                id: "cpo_math_1",
                title: "SSC CPO Maths Chapterwise Test",
                durationMinutes: 15,
                questions: [
                    {
                        question: "In an election between two candidates, 87% of registered voters cast their vote. The winning candidate got 52% of valid votes and won by 1653 votes. How many voters were registered?",
                        options: ["50001", "50003", "50000", "49998"],
                        correctIndex: 2
                    }
                ]
            }
        ];

        let currentUser = null, activeTest = null, currentQIndex = 0, userAnswers = {};

        function showLoginForm() {
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function showRegisterForm() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registerSection').classList.remove('hidden');
        }

        async function register() {
            const fullName = document.getElementById('regFullName').value.trim();
            const age = document.getElementById('regAge').value.trim();
            const gender = document.getElementById('regGender').value;
            const place = document.getElementById('regPlace').value.trim();
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value.trim();
            
            if(!fullName || !age || !gender || !place || !username || !password) {
                alert("Please fill in all registration fields.");
                return;
            }

            const res = await fetch('/api/register', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ fullName, age, gender, place, username, password }) 
            });
            const data = await res.json();
            if(res.ok) {
                alert("Registration successful! Please log in.");
                showLoginForm();
            } else {
                alert(data.error || "Registration failed.");
            }
        }

        async function login() {
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();
            
            const res = await fetch('/api/login', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ username, password }) 
            });
            
            if (res.ok) { 
                currentUser = username;
                showDashboard(); 
            } else { 
                alert("Invalid credentials"); 
            }
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = currentUser;
            renderTestList();
        }

        function verifyAccessCode() {
            const enteredCode = document.getElementById('accessCodeInput').value.trim();
            if (enteredCode === SECRET_CODE) {
                isUnlocked = true;
                alert("Access Code Verified! All mock tests unlocked.");
                document.getElementById('lockContainer').classList.add('hidden');
                renderTestList();
            } else {
                alert("Incorrect Passcode! Access Denied.");
            }
        }

        function renderTestList() {
            const list = document.getElementById('testList');
            list.innerHTML = ALL_MOCK_TESTS.map(t => `
                <div class="card">
                    <div>
                        <strong>${t.title}</strong>
                        <div style="font-size:12px; color:#666;">${t.questions.length} Questions | ${t.durationMinutes} Mins</div>
                    </div>
                    ${isUnlocked 
                        ? `<button class="btn-start" onclick="openInstructions('${t.id}')">Start Test</button>` 
                        : `<button class="btn-start" style="background:#6c757d;" onclick="alert('Please enter passcode CPOAIR1 above to unlock.')">Locked 🔒</button>`}
                </div>
            `).join('');
        }

        function openInstructions(testId) {
            activeTest = ALL_MOCK_TESTS.find(t => t.id === testId);
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('instructionScreen').classList.remove('hidden');
            document.getElementById('instTitle').innerText = activeTest.title;
        }

        function startTestActual() {
            if (!document.getElementById('declarationCheck').checked) {
                alert("Please check the agreement box to proceed."); return;
            }
            document.getElementById('instructionScreen').classList.add('hidden');
            document.getElementById('testPortal').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = activeTest.questions[currentQIndex];
            document.getElementById('qNum').innerText = currentQIndex + 1;
            document.getElementById('questionText').innerText = q.question;
            document.getElementById('optionsContainer').innerHTML = q.options.map((opt, i) => `
                <div class="option-item ${userAnswers[currentQIndex] === i ? 'selected' : ''}" onclick="userAnswers[${currentQIndex}]=${i}; renderQuestion();">
                    ${opt}
                </div>
            `).join('');
        }

        function finishTest() {
            alert("Test submitted successfully!");
            location.reload();
        }
    </script>
</body>
</html>
