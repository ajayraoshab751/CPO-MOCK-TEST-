<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPO Mock Test Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 700px; margin: auto; }
        .hidden { display: none; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin: 5px 2px; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-success { background: #28a745; }
        .btn-secondary { background: #6c757d; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-box { background: #e9ecef; padding: 12px; border-radius: 5px; text-align: center; }
        .option { display: block; width: 100%; text-align: left; background: #f8f9fa; border: 1px solid #ccc; padding: 10px; margin: 5px 0; border-radius: 4px; }
        .solution-card { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; margin-top: 10px; }
        .trick-card { background: #d4edda; border-left: 4px solid #28a745; padding: 10px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card" id="authBox">
    <h2>Student Login / Registration</h2>
    <input type="text" id="username" placeholder="Username / Email" style="width: 95%; padding: 8px; margin-bottom: 10px;"><br>
    <input type="password" id="password" placeholder="Password" style="width: 95%; padding: 8px; margin-bottom: 10px;"><br>
    <button class="btn btn-success" onclick="login()">Login</button>
    <button class="btn" onclick="register()">Register</button>
</div>

<div class="card hidden" id="dashboard">
    <h2>Welcome, <span id="userDisp"></span>!</h2>
    <p>Total Attempts Used: <strong id="attemptCount">0</strong> / 20</p>
    <button class="btn btn-success" onclick="startTest()">Start Mock Test</button>
</div>

<div class="card hidden" id="testEngine">
    <div style="display: flex; justify-space-between; align-items: center;">
        <h3 id="qTitle">Question</h3>
        <div>Timer: <strong id="timer">00:00</strong></div>
    </div>
    <p id="qText" style="font-size: 1.1em;"></p>
    <div id="optionsBox"></div>
    <div style="margin-top: 15px;">
        <button class="btn btn-secondary" onclick="prevQuestion()">Previous</button>
        <button class="btn btn-warning" onclick="markReview()">Mark for Review</button>
        <button class="btn" onclick="nextQuestion()">Next</button>
        <button class="btn btn-success" style="float: right;" onclick="submitTest()">Submit Test</button>
    </div>
</div>

<div class="card hidden" id="resultPage">
    <h2>Test Summary Performance</h2>
    <div class="stat-grid">
        <div class="stat-box">Score: <h3 id="resScore">0</h3></div>
        <div class="stat-box">Percentage: <h3 id="resPct">0%</h3></div>
        <div class="stat-box">Time Taken: <h3 id="resTime">0s</h3></div>
        <div class="stat-box">Attempt #: <h3 id="resAttempt">1</h3></div>
    </div>
    <div class="stat-grid">
        <div class="stat-box" style="color: green;">Correct: <strong id="resCorrect">0</strong></div>
        <div class="stat-box" style="color: red;">Incorrect: <strong id="resIncorrect">0</strong></div>
        <div class="stat-box" style="color: gray;">Unattempted: <strong id="resUnattempted">0</strong></div>
        <div class="stat-box" style="color: orange;">Review: <strong id="resReview">0</strong></div>
    </div>
    <button class="btn btn-success" onclick="toggleSolutions()">View Detailed Solutions & Short Tricks</button>
    <button class="btn" onclick="reattemptTest()">Reattempt Test</button>
</div>

<div class="card hidden" id="solutionsPage" style="margin-top: 15px;">
    <h3>Detailed Solutions & Short Tricks</h3>
    <div id="solutionsList"></div>
</div>

<script src="questions.js"></script>
<script>
let currentUser = null, currentQ = 0, timerInterval = null, secondsElapsed = 0;
let userAnswers = {}, reviewMarks = {};

function login() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) })
    .then(r => r.json()).then(d => {
        if(d.success) { currentUser = u; showDashboard(); } else alert(d.error);
    });
}

function register() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    fetch('/api/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) })
    .then(r => r.json()).then(d => {
        if(d.success) alert('Registration successful! Click Login.'); else alert(d.error);
    });
}

function showDashboard() {
    document.getElementById('authBox').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('userDisp').innerText = currentUser;
    fetch('/api/attempts/' + currentUser).then(r => r.json()).then(d => {
        document.getElementById('attemptCount').innerText = d.totalAttempts;
    });
}

function startTest() {
    userAnswers = {}; reviewMarks = {}; currentQ = 0; secondsElapsed = 0;
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('resultPage').classList.add('hidden');
    document.getElementById('solutionsPage').classList.add('hidden');
    document.getElementById('testEngine').classList.remove('hidden');
    
    timerInterval = setInterval(() => {
        secondsElapsed++;
        let m = Math.floor(secondsElapsed / 60), s = secondsElapsed % 60;
        document.getElementById('timer').innerText = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
    }, 1000);
    
    renderQuestion();
}

function renderQuestion() {
    const q = testQuestions[currentQ];
    document.getElementById('qTitle').innerText = `Question ${currentQ + 1} of ${testQuestions.length}`;
    document.getElementById('qText').innerText = q.question;
    
    let html = '';
    q.options.forEach((opt, idx) => {
        let checked = userAnswers[currentQ] === idx ? 'checked' : '';
        html += `<label class="option"><input type="radio" name="opt" onclick="selectOpt(${idx})" ${checked}> ${opt}</label>`;
    });
    document.getElementById('optionsBox').innerHTML = html;
}

function selectOpt(idx) { userAnswers[currentQ] = idx; }
function prevQuestion() { if(currentQ > 0) { currentQ--; renderQuestion(); } }
function nextQuestion() { if(currentQ < testQuestions.length - 1) { currentQ++; renderQuestion(); } }
function markReview() { reviewMarks[currentQ] = true; nextQuestion(); }

function submitTest() {
    clearInterval(timerInterval);
    let correct = 0, incorrect = 0, unattempted = 0, marked = Object.keys(reviewMarks).length;
    
    testQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === undefined) unattempted++;
        else if (userAnswers[idx] === q.correctAnswer) correct++;
        else incorrect++;
    });

    let score = (correct * 2) - (incorrect * 0.5); // Marks: +2 Correct, -0.5 Incorrect
    let maxMarks = testQuestions.length * 2;
    let percentage = ((score / maxMarks) * 100).toFixed(2);

    const payload = {
        username: currentUser, score, percentage, timeTaken: secondsElapsed,
        correct, incorrect, unattempted, markedForReview: marked
    };

    fetch('/api/submit-test', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    }).then(r => r.json()).then(data => {
        if(!data.success) { alert(data.error); return; }
        
        document.getElementById('testEngine').classList.add('hidden');
        document.getElementById('resultPage').classList.remove('hidden');
        
        document.getElementById('resScore').innerText = score;
        document.getElementById('resPct').innerText = percentage + '%';
        document.getElementById('resTime').innerText = secondsElapsed + 's';
        document.getElementById('resAttempt').innerText = data.attemptNumber;
        document.getElementById('resCorrect').innerText = correct;
        document.getElementById('resIncorrect').innerText = incorrect;
        document.getElementById('resUnattempted').innerText = unattempted;
        document.getElementById('resReview').innerText = marked;
        
        buildSolutions();
    });
}

function buildSolutions() {
    let html = '';
    testQuestions.forEach((q, idx) => {
        let userAns = userAnswers[idx] !== undefined ? q.options[userAnswers[idx]] : 'Unattempted';
        let correctAns = q.options[q.correctAnswer];
        
        html += `<div style="border-bottom: 1px solid #ccc; padding: 10px 0;">
            <p><strong>Q${idx + 1}: ${q.question}</strong></p>
            <p>Your Answer: <span style="color:${userAnswers[idx] === q.correctAnswer ? 'green':'red'}">${userAns}</span> | Correct Answer: <strong>${correctAns}</strong></p>
            <div class="solution-card"><strong>Detailed Solution:</strong><br>${q.explanation}</div>
            ${q.shortTrick ? `<div class="trick-card"><strong>Short Trick:</strong><br>${q.shortTrick}</div>` : ''}
        </div>`;
    });
    document.getElementById('solutionsList').innerHTML = html;
}

function toggleSolutions() {
    document.getElementById('solutionsPage').classList.toggle('hidden');
}

function reattemptTest() {
    startTest();
}
</script>
</body>
</html>
