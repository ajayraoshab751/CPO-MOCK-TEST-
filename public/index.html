<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPO Mock Portal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .banner { background: #ffc107; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:disabled { background: #cccccc; }
  </style>
</head>
<body>

  <div class="banner">Target: Score 160+ in CPO Tier-1 Mock Tests!</div>

  <div class="card" id="loginCard">
    <h2>Student Auth</h2>
    <input type="email" id="email" placeholder="Email" value="ajayraoshab751@gmail.com">
    <input type="password" id="password" placeholder="Password" value="sunitadevi">
    <input type="text" id="name" placeholder="Name" value="Ajay">
    <button id="loginBtn" onclick="handleLogin()">Login / Start</button>
  </div>

  <div class="card" id="adminCard" style="display:none;">
    <h2>Admin Dashboard</h2>
    <p>Welcome, Admin! You are successfully logged in.</p>
    <button onclick="location.reload()">Logout</button>
  </div>

  <script>
    async function handleLogin() {
      const btn = document.getElementById('loginBtn');
      btn.innerText = 'Logging in...';
      btn.disabled = true;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name })
        });

        const data = await res.json();
        if (data.success) {
          if (data.isAdmin) {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('adminCard').style.display = 'block';
          } else {
            alert('Logged in as Student: ' + data.user.name);
          }
        } else {
          alert('Login failed!');
        }
      } catch (err) {
        alert('Connection error. Please try again.');
      } finally {
        btn.innerText = 'Login / Start';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
