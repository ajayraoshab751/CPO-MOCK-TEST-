<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CPO MOCK TEST</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f6f9; padding: 20px; }
        .hidden { display: none !important; }
        .auth-card { max-width: 400px; margin: 80px auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .auth-card input { width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn-blue { background: #002d62; color: white; border: none; padding: 10px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stats-grid { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: #1a73e8; color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-box.green { background: #28a745; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #002d62; color: white; }
    </style>
</head>
<body>

    <!-- Admin Access Lock -->
    <div id="adminAuthScreen" class="auth-card">
        <h2>🔒 Admin Access</h2>
        <p style="font-size: 13px; color: #666; margin-top: 6px;">Enter secret admin password to proceed.</p>
        <input type="password" id="adminSecretInput" placeholder="Enter Secret Code">
        <button class="btn-blue" onclick="verifyAdminKey()">Access Dashboard</button>
    </div>

    <!-- Admin Content Panel -->
    <div id="adminDashboard" class="hidden">
        <h2>📊 Admin Control Panel</h2>
        
        <div class="stats-grid" style="margin-top: 20px;">
            <div class="stat-box">
                <h3 id="totalReg">0</h3>
                <p>Total Registered Users</p>
            </div>
            <div class="stat-box green">
                <h3 id="liveUsers">0</h3>
                <p>Currently Live Online</p>
            </div>
        </div>

        <div class="card">
            <h3>Registered Student List</h3>
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Username / Email</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Place</th>
                        <th>Registered At</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const ADMIN_SECRET = "sunitadevi";

        function verifyAdminKey() {
            const enteredKey = document.getElementById('adminSecretInput').value.trim();
            if (enteredKey === ADMIN_SECRET) {
                document.getElementById('adminAuthScreen').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                loadAdminStats();
                setInterval(loadAdminStats, 10000); // Refresh stats every 10 seconds
            } else {
                alert("Incorrect Secret Code! Access Denied.");
            }
        }

        async function loadAdminStats() {
            // Using backend secret key CPOADMIN123 internally
            const res = await fetch(`/api/admin/stats?key=CPOADMIN123`);
            if (!res.ok) return;
            
            const data = await res.json();
            document.getElementById('totalReg').innerText = data.totalRegistered;
            document.getElementById('liveUsers').innerText = data.currentlyOnline;

            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = data.allUsers.map(u => `
                <tr>
                    <td>${u.fullName || '-'}</td>
                    <td>${u.username}</td>
                    <td>${u.age || '-'}</td>
                    <td>${u.gender || '-'}</td>
                    <td>${u.place || '-'}</td>
                    <td>${new Date(u.registeredAt).toLocaleString()}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
